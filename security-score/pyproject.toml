[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "appsec-security-score"
version = "0.1.3"
description = "Deterministic repository security score and change relevance"
requires-python = ">=3.10"

[project.scripts]
security-score = "score:main"

[tool.setuptools]
py-modules = ["score", "score_version", "score_reporting", "score_core", "score_sources", "score_remote", "score_remote_sources", "score_architecture", "score_relevance", "score_calculation"]
package-dir = {"" = "scripts"}

[tool.setuptools.data-files]
"share/security-score" = ["rules.json"]
