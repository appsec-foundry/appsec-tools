[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "appsec-security-score"
version = "0.3.3"
description = "Deterministic repository security score and change relevance"
requires-python = ">=3.12"

[project.scripts]
security-score = "score:main"

[tool.setuptools]
py-modules = ["score", "score_version", "score_update","score_reporting", "score_style","score_core", "score_sources", "score_remote", "score_remote_sources", "score_architecture", "score_controls", "score_infrastructure", "score_overview", "score_relevance", "score_calculation", "score_assessment", "score_design", "score_boundaries", "score_profiles", "score_iac", "score_compose", "score_supply_chain", "score_ai"]
package-dir = {"" = "scripts"}

[tool.setuptools.data-files]
"share/security-score" = ["rules.json"]
