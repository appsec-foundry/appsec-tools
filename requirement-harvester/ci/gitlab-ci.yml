# Use as .gitlab-ci.yml or include with include:local.
# Prerequisite: dedicated non-root shell runner with Python >=3.10,
# tagged python-nonroot; internal sources need appropriate network access.
stages: [verify, harvest]

default:
  tags: [python-nonroot]
  before_script:
    - test "$(id -u)" -ne 0
    - cd requirement-harvester
    - python3 -m venv .venv
    - .venv/bin/python -m pip install --require-hashes -r requirements-dev.lock

verify-harvester:
  stage: verify
  script:
    - .venv/bin/python -m pytest
    - .venv/bin/python scripts/check_dependencies.py

harvest-requirements:
  stage: harvest
  environment:
    name: requirement-harvest
  rules:
    - if: '$CI_PROJECT_VISIBILITY == "private" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PROJECT_VISIBILITY == "private" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "web"'
    - when: never
  script:
    - .venv/bin/python scripts/ci_run.py examples/tss-web.yaml
  artifacts:
    when: always
    access: maintainer
    expire_in: 7 days
    paths:
      - requirement-harvester/ci-artifacts/report.json
      - requirement-harvester/ci-artifacts/catalogs/*.oscal.yaml
